services:
  - type: web
    name: immo-agence
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        value: https://immo-agence-api.onrender.com

  - type: web
    name: immo-agence-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: PAYDUNYA_MODE
        value: live
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PUBLIC_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      - key: PAYDUNYA_STORE_NAME
        value: ImmoAgence Senegal
      - key: PAYDUNYA_STORE_TAGLINE
        value: Immobilier premium au Senegal
      - key: PAYDUNYA_STORE_PHONE
        sync: false
      - key: PAYDUNYA_STORE_WEBSITE_URL
        sync: false
      - key: PAYDUNYA_RETURN_URL
        sync: false
      - key: PAYDUNYA_CANCEL_URL
        sync: false
      - key: PAYDUNYA_IPN_URL
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
